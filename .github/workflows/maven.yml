name: Java CI with Maven and Docker Hub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  maven-build:
    name: Build & Test with Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test with Maven
        run: mvn clean package

      - name: Verify generated JAR
        run: |
          test -f target/maven-github-demo-1.0-SNAPSHOT.jar || exit 1
          echo "Generated JAR verified: target/maven-github-demo-1.0-SNAPSHOT.jar"

      - name: Upload built JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-jar
          path: target/maven-github-demo-1.0-SNAPSHOT.jar
          retention-days: 1

  docker-publish:
    name: Build & Push Docker Image
    needs: maven-build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download built JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: maven-jar
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ramreddy80/maven-github-demo6:1.0
            ramreddy80/maven-github-demo6:latest
